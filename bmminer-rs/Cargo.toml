[package]
name = "bmminer-rs"
version = "0.1.0"
edition = "2021"

[lib]
crate-type = ["lib", "staticlib", "cdylib"]

[dependencies]
# Lock-free data structures
crossbeam = { version = "0.8", default-features = false, features = ["std"] }

# Hardware access
volatile-register = "0.2"
libc = "0.2"

# SIMD and crypto
sha2 = { version = "0.10", features = ["asm"] }
hex = "0.4"

# Async runtime (for pool communication)
tokio = { version = "1", features = ["rt", "sync", "time", "macros", "net", "io-util"], optional = true }

# Serialization (for Stratum and API)
serde = { version = "1", features = ["derive"], optional = true }
serde_json = { version = "1", optional = true }

# Signal handling
ctrlc = { version = "3.4", optional = true }

# Parallel processing
rayon = { version = "1.10", optional = true }

[dev-dependencies]
# Benchmarking
criterion = { version = "0.5", features = ["html_reports"] }
rand = "0.8"

[features]
default = []
api = ["tokio", "serde", "serde_json", "ctrlc", "rayon"]
bsv-node = ["api"]  # BSV node requires validation pool (api feature)
full = ["api", "bsv-node"]
aggressive = ["api", "rayon"]  # All aggressive optimizations

[[bench]]
name = "nonce_queue"
harness = false

[[bench]]
name = "mmio_access"
harness = false

[[bench]]
name = "c_comparison"
harness = false

[profile.release]
opt-level = 3
lto = "fat"
codegen-units = 1
panic = "abort"
strip = true
overflow-checks = false

[profile.bench]
inherits = "release"
